name: Compiled static release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:production
      - run: pnpm test
      - run: pnpm audit:assets
      - run: uv run --locked python scripts/package_static_release.py
      - name: Publish compiled site and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" work/releases/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" work/releases/* --verify-tag --prerelease --title "NextMedTator $GITHUB_REF_NAME" --notes-file docs/nextmedtator/CURRENT-MODELS.md
          fi
